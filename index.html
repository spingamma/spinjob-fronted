<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tarjetoso | Directorio de Profesionales y Negocios en Bolivia</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Tarjetoso es el directorio de tarjetas digitales profesionales de Bolivia. Encuentra, contacta y califica a los mejores profesionales independientes y negocios locales cerca de ti." />
    <meta name="keywords" content="tarjetas digitales, directorio profesional, Bolivia, negocios locales, profesionales independientes, tarjeta de presentación digital, Cochabamba, Santa Cruz, La Paz, tarjetoso" />
    <meta name="author" content="Tarjetoso" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tarjetoso.com/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tarjetoso.com/" />
    <meta property="og:title" content="Tarjetoso | Directorio de Profesionales y Negocios en Bolivia" />
    <meta property="og:description" content="Encuentra, contacta y califica a los mejores profesionales independientes y negocios locales de Bolivia. Tu directorio de tarjetas digitales." />
    <meta property="og:image" content="https://tarjetoso.com/icon-512.png" />
    <meta property="og:site_name" content="Tarjetoso" />
    <meta property="og:locale" content="es_BO" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tarjetoso | Directorio de Profesionales y Negocios en Bolivia" />
    <meta name="twitter:description" content="Encuentra, contacta y califica a los mejores profesionales independientes y negocios locales de Bolivia." />
    <meta name="twitter:image" content="https://tarjetoso.com/icon-512.png" />

    <!-- Geo Tags (Bolivia) -->
    <meta name="geo.region" content="BO" />
    <meta name="geo.placename" content="Bolivia" />

    <meta name="theme-color" content="#1E3D51" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style>
      /* Splash Screen — visible while JS bundle loads */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #1D565F;
        transition: opacity 0.4s ease-out;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen img {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      #splash-screen .splash-name {
        margin-top: 20px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.02em;
      }
      #splash-screen .splash-dots {
        margin-top: 28px;
        display: flex;
        gap: 8px;
      }
      #splash-screen .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: rgba(255,255,255,0.4);
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      #splash-screen .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #splash-screen .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes splash-dot {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen (visible until React mounts) -->
    <div id="splash-screen">
      <img src="/icon-512.png" alt="Tarjetoso" />
      <div class="splash-name">Tarjetoso</div>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
