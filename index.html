    <!-- SEO Meta Tags -->
    <meta name="description" content="Tarjetoso es el directorio de tarjetas digitales profesionales de Bolivia. Encuentra, contacta y califica a los mejores profesionales independientes y negocios locales cerca de ti." />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tarjetoso.com/" />
    <meta property="og:title" content="Tarjetoso | Directorio de Profesionales y Negocios en Bolivia" />
    <meta property="og:description" content="Encuentra, contacta y califica a los mejores profesionales independientes y negocios locales de Bolivia. Tu directorio de tarjetas digitales." />
    <meta property="og:image" content="https://tarjetoso.com/icon-512.png" />
    <meta property="og:site_name" content="Tarjetoso" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tarjetoso | Directorio de Profesionales y Negocios en Bolivia" />
    <meta name="twitter:description" content="Encuentra, contacta y califica a los mejores profesionales independientes y negocios locales de Bolivia." />
    <meta name="twitter:image" content="https://tarjetoso.com/icon-512.png" />

    <!-- Geo Tags (Bolivia) -->
    <meta name="geo.region" content="BO" />
    <meta name="geo.placename" content="Bolivia" />

    <meta name="theme-color" content="#1A535C" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style>
      /* Splash Screen — visible while JS bundle loads */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #1A535C;
        transition: opacity 0.4s ease-out;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen img {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      #splash-screen .splash-name {
        margin-top: 20px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.02em;
      }
      #splash-screen .splash-dots {
        margin-top: 28px;
        display: flex;
        gap: 8px;
      }
      #splash-screen .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: rgba(255,255,255,0.4);
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      #splash-screen .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #splash-screen .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes splash-dot {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen (visible until React mounts) -->
    <div id="splash-screen">
      <img src="/icon-512.webp" alt="Tarjetoso" />
      <div class="splash-name">Tarjetoso</div>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
      <button id="rescue-btn" style="display:none; margin-top: 30px; background: var(--color-secondary, #F9842C); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-family: sans-serif; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        ¿Problemas al cargar? Reparar
      </button>
      <script>
        setTimeout(function() {
          var splash = document.getElementById('splash-screen');
          var rescueBtn = document.getElementById('rescue-btn');
          if (splash && !splash.classList.contains('fade-out')) {
            rescueBtn.style.display = 'block';
            rescueBtn.onclick = function() {
              rescueBtn.innerText = 'Reparando...';
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  keys.forEach(function(key) { caches.delete(key); });
                });
              }
              setTimeout(function() { window.location.reload(true); }, 800);
            };
          }
        }, 6000);
      </script>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
